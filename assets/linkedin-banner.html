<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Archivo';src:url('archivo.woff2') format('woff2-variations');font-weight:100 900;font-stretch:62% 125%}
html,body{margin:0}
body{width:1584px;height:396px;overflow:hidden;background:#F2F3F5;font-family:'Archivo','Helvetica Neue',Arial,sans-serif;color:#14171F;-webkit-font-smoothing:antialiased;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(20,23,31,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(20,23,31,.045) 1px,transparent 1px);background-size:44px 44px;background-position:-22px -22px}
.block{position:absolute;left:520px;top:86px;right:72px;display:flex;flex-direction:column;gap:30px}
h1{margin:0;font-size:68px;line-height:.94;font-weight:660;font-stretch:125%;letter-spacing:-.045em;position:relative;display:inline-block;align-self:flex-start}
.redline{position:absolute;inset:-12px -20px -8px -20px;border:1.5px solid #C8174F;pointer-events:none}
.redline i{position:absolute;width:12px;height:12px;background:#fff;border:1.5px solid #C8174F;box-sizing:border-box}
.tag{position:absolute;top:-34px;left:-1.5px;height:28px;padding:0 12px;background:#C8174F;color:#fff;font-size:14px;font-weight:600;font-stretch:100%;letter-spacing:.08em;display:flex;align-items:center;border-radius:4px}
.sub{font-size:30px;font-weight:500;font-stretch:108%;letter-spacing:-.015em;color:#4A5160}
.row{display:flex;align-items:center;gap:26px;font-size:21px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:#1F9D57;box-shadow:0 0 0 6px rgba(31,157,87,.16)}
.sep{width:1px;height:22px;background:#D5D9DF}
.site{color:#14171F}
.muted{color:#636A78;font-weight:500}
.left{position:absolute;left:72px;top:52px;display:flex;flex-direction:column;gap:14px;font-size:19px;font-weight:600;color:#2B303B}
.left span{display:flex;align-items:center;gap:12px}
.left b{width:8px;height:8px;border-radius:50%;background:#C8174F;display:inline-block}
.corner{position:absolute;right:72px;bottom:40px;display:flex;gap:10px}
.chip{padding:8px 16px;border-radius:999px;background:#E4E7EB;color:#2B303B;font-size:16px;font-weight:550}
</style>
</head>
<body>
<div class="grid"></div>
<div class="left">
  <span><b></b>React · Next.js</span>
  <span><b></b>Astro · SvelteKit</span>
  <span><b></b>Payload · Sanity · Strapi</span>
  <span><b></b>Stripe · AI features</span>
</div>
<div class="block">
  <h1>Frontends that stay fast<br>as your product grows.<div class="redline"><div class="tag">h1</div><i style="top:-6px;left:-6px"></i><i style="top:-6px;right:-6px"></i><i style="bottom:-6px;left:-6px"></i><i style="bottom:-6px;right:-6px"></i></div></h1>
  <div class="row"><span class="dot"></span><span class="muted">Open for new projects</span><span class="sep"></span><span class="site">zuanda.web.id</span><span class="sep"></span><span class="muted">Top Rated Plus on Upwork</span></div>
</div>
</body>
</html>
